name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: List files (Debug)
      run: ls -R src/components/Button

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install ALL dependencies
      run: npm install
    
    - name: Run tests
      run: npm test -- --watchAll=false --coverage --passWithNoTests
      env:
        CI: true
    
    - name: Build project
      run: npm run build